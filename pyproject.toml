[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bao"
version = "0.2.0"
description = "A desktop pet that shows what Claude Code is doing"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
app = ["pyinstaller>=6"]  # build Bao.app: packaging/build_mac.sh

[project.scripts]
bao = "bao.__main__:main"

[tool.setuptools.packages.find]
include = ["bao*", "claude_pet"]

[tool.setuptools.package-data]
bao = ["characters/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
